<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Helply Analytics</title>
<style>
:root{--bg:#f7f8fa;--card:#fff;--ink:#12161c;--mut:#6b7280;--line:#e5e7eb;--red:#d92d20;--grn:#039855;--acc:#4f46e5}
:root:not([data-theme=light]) {}
@media (prefers-color-scheme: dark){:root:not([data-theme=light]){--bg:#0f1115;--card:#171a21;--ink:#e6e8ec;--mut:#9aa1ad;--line:#262b34}}
:root[data-theme=dark]{--bg:#0f1115;--card:#171a21;--ink:#e6e8ec;--mut:#9aa1ad;--line:#262b34}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif}
.top{display:flex;align-items:center;gap:14px;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--line)}
.logo{font-weight:700;letter-spacing:-.02em;font-size:16px}
.logo span{color:var(--acc)}
.fresh{margin-left:auto;color:var(--mut);font-size:12px}
.wrap{display:grid;grid-template-columns:224px 1fr;gap:18px;padding:18px;max-width:1240px;margin:0 auto}
@media(max-width:860px){.wrap{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.side h4{margin:0 0 10px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--mut)}
.side label{display:flex;gap:8px;align-items:flex-start;margin:9px 0;cursor:pointer;font-size:13px}
.side .sub{color:var(--mut);font-size:11px;margin-left:22px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:16px}
.kpi .l{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);display:flex;align-items:center;gap:5px}
.kpi .v{font-size:34px;font-weight:700;letter-spacing:-.03em;margin-top:4px}
.kpi .d{font-size:12px;font-weight:600}
.i{display:inline-flex;width:14px;height:14px;border-radius:50%;border:1px solid var(--mut);color:var(--mut);
   font-size:10px;align-items:center;justify-content:center;cursor:help;font-style:normal}
.row{display:grid;grid-template-columns:1.15fr 1fr;gap:16px;margin-bottom:16px}
@media(max-width:860px){.row{grid-template-columns:1fr}}
h3{margin:0 0 14px;font-size:13px;font-weight:600}
.bar{height:26px;background:var(--acc);border-radius:3px;opacity:.85}
.fl{display:grid;grid-template-columns:150px 1fr 92px;gap:10px;align-items:center;margin:7px 0;font-size:13px}
.fl .n{text-align:right;color:var(--mut);font-variant-numeric:tabular-nums}
select{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 9px;font-size:13px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:500;color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.07em;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:7px 8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.mini{height:6px;background:var(--acc);border-radius:99px;display:inline-block;vertical-align:middle;opacity:.75}
.warnc{color:var(--red);font-weight:600}
.scroll{overflow-x:auto}
</style>

const $=s=>document.querySelector(s);
function key(){return (($('#fbot').checked)?1:0)+''+(($('#fint').checked)?1:0)}
function chart(t){const w=440,h=150,pad=26;const mx=Math.max(...t.map(d=>d.rate))*1.15;
 const pts=t.map((d,i)=>[pad+i*(w-pad-10)/(t.length-1), h-pad-(d.rate/mx)*(h-pad-10)]);
 return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto" preserveAspectRatio="xMidYMid meet">
 <polyline fill="none" stroke="var(--acc)" stroke-width="2.5" points="${pts.map(p=>p.join(',')).join(' ')}"/>
 ${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="var(--acc)"/>
   <text x="${p[0]}" y="${h-8}" font-size="10" fill="var(--mut)" text-anchor="middle">${t[i].m}</text>
   <text x="${p[0]}" y="${p[1]-9}" font-size="10" fill="var(--ink)" text-anchor="middle">${t[i].rate}%</text>`).join('')}
 </svg>`}
function render(){const d=D.d[key()];
 const first=d.trend[0].rate,last=d.trend[d.trend.length-1].rate,dd=(last-first).toFixed(1);
 $('#k1').textContent=d.act+'%';
 $('#k1d').innerHTML=(dd<0?`<span class="warnc">▼ ${dd}pp vs Feb</span>`
   :`<span style="color:var(--grn)">▲ +${dd}pp vs Feb</span>`);
 $('#k2').textContent=d.signups.toLocaleString();
 const q1=d.trend[0].n+d.trend[1].n, q3=d.trend[4].n+d.trend[5].n;
 $('#k2d').textContent='▲ '+Math.round(100*(q3-q1)/q1)+'% vs Q1';
 $('#k3').textContent=d.activated.toLocaleString();
 $('#k4').textContent=d.paid.toLocaleString();
 $('#chart').innerHTML=chart(d.trend);
 const mx=d.funnel[0].n;
 $('#funnel').innerHTML=d.funnel.map(f=>`<div class="fl"><div>${f.label}</div>
   <div><div class="bar" style="width:${Math.max(2,100*f.n/mx)}%"></div></div>
   <div class="n">${f.n.toLocaleString()} · ${(100*f.n/mx).toFixed(1)}%</div></div>`).join('');
 const g=d.grid[$('#dim').value+'|'+$('#step').value];
 $('#bd').innerHTML=`<tr><th>Segment</th><th>Users</th><th>Converted</th><th>Rate</th><th style="width:34%"></th></tr>`+
  g.rows.map(r=>`<tr><td>${r.seg}</td><td>${r.den.toLocaleString()}</td><td>${r.num.toLocaleString()}</td>
   <td${r.rate<g.base*0.75?' class="warnc"':''}>${r.rate}%</td>
   <td><span class="mini" style="width:${Math.max(2,r.rate)}%"></span></td></tr>`).join('')+
  `<tr><td style="color:var(--mut)">All</td><td></td><td></td><td style="color:var(--mut)">${g.base}%</td><td></td></tr>`}
$('#dim').innerHTML=D.dims.map(d=>`<option value="${d[0]}">${d[1]}</option>`).join('');
$('#step').innerHTML=D.trans.map(t=>`<option value="${t[0]}">${t[1]}</option>`).join('');
$('#step').value='integration_verified';  // the cut that confirms 'mobile is broken'
['#fbot','#fint','#dim','#step'].forEach(s=>$(s).addEventListener('change',render));

// ── PRESENTER CONTROLS (instructor only; nothing here changes a number) ──────
// h .... hide/show the two filter checkboxes  (?filters=0 starts hidden)
// b .... tick/untick "Exclude known bots"     — the reveal, without the mouse
// r .... reset to the opening state
const q = new URLSearchParams(location.search);
const setBox = on => $('#fbox').style.display = on ? '' : 'none';
const START_HIDDEN = q.get('filters') === '0';
if (START_HIDDEN) setBox(false);
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === 'h') setBox($('#fbox').style.display === 'none');
  else if (k === 'b') { $('#fbot').checked = !$('#fbot').checked; render(); }
  // r must restore the OPENING state, which means hidden if we opened hidden.
  // Earlier this always called setBox(true), so the documented "b, b, r" preflight
  // left the bot checkbox on screen before students arrived. Caught by codex.
  else if (k === 'r') { setBox(!START_HIDDEN); $('#fbot').checked = $('#fint').checked = false;
                        $('#dim').value = 'device'; $('#step').value = 'integration_verified'; render(); }
});
render();
</script>
